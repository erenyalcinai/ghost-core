# VPS'te /etc/ssh/sshd_config.d/10-ghost-keepalive.conf olarak durur (root).
# Buradaki kopya yalnız KAYIT amaçlı — sunucu yeniden kurulursa geri koy.
#
# Ghost (2026-09-01): ölü ters tünel oturumları 131 dk yerine 90 sn'de toplansın.
# Sebep: Mac uyuyunca yarı-açık oturum 8765/8101'i işgal ediyor, tünel bind
# edemiyor, Mac+telefon rayı ölüyordu. Ayrıntı: ops/tunnel_watch.py başlığı.
#
# Varsayılan ClientAliveInterval 0'dı = sshd ölü eşi HİÇ sormuyordu; toplanması
# yalnız çekirdeğin TCP keepalive'ına kalıyordu (7200 + 75*9 = 131 dakika).
#
# Uygularken: önce `sshd -t` ile doğrula, sonra `systemctl reload ssh`
# (restart DEĞİL — açık oturumlar kopmasın). Kilitlenmeye karşı geri alma
# sigortası kur; sigortayı iptal ederken SÜRECİ ÖLDÜR, onay dosyasını silmek
# yetmez (süreç uyanınca dosyayı bulamayıp geri alır — 2026-09-01'de yaşandı).
ClientAliveInterval 30
ClientAliveCountMax 3
