# Ghost — 4. tur denetim Y1 (2026-10-28): ghost kullanıcısı localhost'a kendi anahtarıyla ssh açıp
# /run/ghost-vekil/mac.sock'a yönlendirme kurarak Mac tünelinin "gözetimli" ssh zincirini üretemesin.
# Loopback'ten gelen ssh oturumlarında her türlü yönlendirme kapalı. Mac'in tüneli (dış adres) etkilenmez.
# Kurulum (root, YubiKey): install -m644 ops/root/sshd_ghost_loopback.conf /etc/ssh/sshd_config.d/10-ghost-loopback.conf
#                          && sshd -t && systemctl reload ssh
Match Address 127.0.0.1,::1
    AllowStreamLocalForwarding no
    AllowTcpForwarding no
    AllowAgentForwarding no
    PermitTunnel no
